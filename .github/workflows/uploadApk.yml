name: Android CI

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_build:
        description: Build and distribute release APK (slower)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELEASE_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.release_build && 'true' || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Quality gate (detekt + tests + androidTest compile + coverage report)
        run: ./gradlew :app:detekt :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:jacocoTestReport

      - name: Upload JaCoCo reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-reports
          retention-days: 7
          path: |
            app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
            app/build/reports/jacoco/jacocoTestReport/html

      - name: Write signing config
        if: github.ref == 'refs/heads/main'
        env:
          KEYSTORE_PROPERTIES: ${{ secrets.JUST_VERONICA }}
          KEYSTORE_FILE_B64: ${{ secrets.JUST_CHILL }}
        run: |
          printf '%s' "$KEYSTORE_PROPERTIES" > keystore.properties
          mkdir -p key
          printf '%s' "$KEYSTORE_FILE_B64" | base64 --decode > key/just_chill_key.p12

      - name: Build APK
        if: github.ref == 'refs/heads/main'
        run: |
          if [ "$RELEASE_BUILD" = "true" ]; then
            ./gradlew :app:assembleRelease
          else
            ./gradlew :app:assembleQa
          fi

      - name: Resolve APK path
        if: github.ref == 'refs/heads/main'
        id: apk
        run: |
          if [ "$RELEASE_BUILD" = "true" ]; then
            APK_DIR="app/build/outputs/apk/release"
          else
            APK_DIR="app/build/outputs/apk/qa"
          fi
          APK_PATH=$(find "$APK_DIR" -maxdepth 1 -name '*.apk' -print -quit)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found in $APK_DIR" >&2
            exit 1
          fi
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Distribute via Firebase App Distribution
        if: github.ref == 'refs/heads/main'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_RELEASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.CREDENTIAL_FILE_CONTENT }}
          groups: Yolo
          file: ${{ steps.apk.outputs.path }}
